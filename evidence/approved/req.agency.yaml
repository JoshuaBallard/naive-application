requirement: High agency
category: must_have
status: SUPPORTED
reasoning: >-
  On 2026-08-05 Josh opened a repository instead of clicking apply, scoped eight issues
  before writing code, and shipped 48 commits through 22 pull requests between 11:19 and
  22:25 the same day. Nobody asked for it. This application is the second instance, in
  a different stack, under a self-imposed deadline. The pattern is also visible at work:
  building a company's first IT budget from nothing, and rebuilding a prioritisation
  system and taking it to executives.
