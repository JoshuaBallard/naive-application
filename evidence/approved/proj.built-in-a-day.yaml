  - claim: 22 pull requests merged, 8 issues opened before the first line of code.
    verification: public_artifact
    evidence_url: https://github.com/JoshuaBallard/built-in-a-day/pulls
  - claim: >-
      The research file names three things Josh got wrong about the company after
      hearing evidence that arrived post-build, rather than quietly correcting them.
    verification: public_artifact
    evidence_url: https://github.com/JoshuaBallard/built-in-a-day/blob/main/research/README.md

known_limitations:
  - >-
      It is a narrative site, not a working system. No backend, no tests, no
      authentication, no state. The engineering on display is scoping and delivery
      discipline, not architecture.
  - >-
      It was built for a different company. This application is the second time Josh
      has built something instead of applying, and that pattern is worth naming
      rather than hiding. See gap.repeat-gesture.
  - >-
      Deliberately no React and no TypeScript. Josh judged that putting a framework
      on a one-day static page would be a costume. That judgment is defensible and it
      also means the site is not evidence of frontend framework skill.

tags: [shipping-speed, agency, product-judgment, honesty]
