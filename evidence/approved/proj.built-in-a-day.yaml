title: Built in a Day
summary: >-
  A twelve-chapter application experience built for a different company on
  2026-08-05, start to finish in one day, with the commit history as the receipt.

problem: >-
  Josh wanted to apply to an AI company and found the normal application process
  told them nothing about how he actually works. A resume lists outcomes. It cannot
  show scoping, sequencing, or what someone does when a plan turns out to be wrong.

what_josh_built: >-
  A static site, no build step and no runtime dependencies, published to GitHub
  Pages. Eight issues scoped before any code. Every change shipped on a branch
  through a pull request. A build log that counts itself from the GitHub API with a
  static fallback for JavaScript-off. Self-hosted variable-font typography, keyboard
  navigation, a skip link, and a measured contrast pass. He also kept the planning
  documents that the finished site contradicts, and wrote a file explaining the gap.

what_josh_learned: >-
  That the honest version reads better than the polished one. The two strongest
  chapters, the build receipts and the section naming his own gaps, were both written
  after re-reading the job posting and noticing the first draft had danced around it.

technologies:
  - HTML
  - CSS
  - vanilla JavaScript
  - GitHub Actions
  - GitHub Pages
  - Claude Code

