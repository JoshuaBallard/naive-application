scope: >-
  Primary administrator for the production virtualization environment. 24 ESXi hosts,
  100+ virtual machines. Architected and deployed VMware Cloud Foundation 5.2.2 from
  scratch, working directly with VMware on IP schema, network topology, and component
  placement. Built a new vSphere 8 environment and migrated off vSphere 7, including a
  new vCenter, with no data lost. Rolled out the full Aria Suite, Lifecycle Manager,
  Automation, and Operations for Logs, integrated with VCF. Applied STIGs by hand
  across every VCF component: ESXi, vCenter, NSX, and the VMs, every control
  individually. Owns daily security operations, including vulnerability scanning and
  remediation and POA&M tracking. Migrated networking off legacy configuration onto a
  newly built distributed switch. Administers Linux BIND DNS for the environment's name
  resolution. Covered Windows administration during personnel gaps so workstation
  compliance never lapsed.

