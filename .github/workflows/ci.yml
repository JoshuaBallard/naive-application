# The gate runs here too, and it fails the build rather than warning.
#
# The personal exclusion list is gitignored, so it arrives as a repository secret. If
# that secret is missing the privacy linter raises and CI fails — a linter that cannot
# load its blocklist must not report a clean run, and that has to be true in CI as much
# as on a laptop.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e "api[dev]"

      - name: Write the exclusion list
        env:
          EXCLUSIONS: ${{ secrets.EVIDENCE_EXCLUSIONS }}
        run: |
          if [ -z "$EXCLUSIONS" ]; then
            echo "::error::EVIDENCE_EXCLUSIONS secret is not set. Failing closed."
            exit 1
          fi
          mkdir -p security
          printf '%s\n' "$EXCLUSIONS" > security/exclusions.local.txt

      - name: Build the evidence artifact
        working-directory: api
        run: python -m app.evidence.compile

      - name: Tests
        working-directory: api
        env:
          ANTHROPIC_API_KEY: not-a-real-key-for-tests
        run: pytest -q

      - name: Confirm no secret escaped into the tree
        run: |
          if git ls-files | grep -qE '(^|/)(\.env|exclusions\.local\.txt)$'; then
            echo "::error::a secret file is tracked by git"
            exit 1
          fi

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
